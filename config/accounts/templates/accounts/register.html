{% extends 'base.html' %}

{% block title %}
Register
{% endblock %}

{% block content %}

<div class="container">

    <div class="card" style="max-width:500px;margin:auto;">

        <h1>Register Agen</h1>

        <form method="post">

            {% csrf_token %}

            {{ form.as_p }}

            <button type="submit">
                Register
            </button>

        </form>

        <p>
            Sudah punya akun?
            <a href="{% url 'login' %}">
                Login
            </a>
        </p>

    </div>

</div>

{% endblock %}
